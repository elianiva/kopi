- id: "1"
  bean: auman
  date: 2026-11-25
  method: Immersion
  gear: Hario Switch
  dose: 12.5
  water: 200
  waterBrand: Nestle
  waterPpm: 150
  waterTemp: 90
  brewTime: "2:40"
  grinder: Timemore C3S
  grindSize: "16"
  filter: Unbranded paper filter
  pourSpeed: 4.5
  pours:
      - { at: "00:00", to: 45 }
      - { at: "00:40", to: 120 }
      - { at: "01:20", to: 200 }
  note: "Switch closed for the bloom. 0:00: pour 45 g. 0:40: open and close the switch, then pour to 120 g. 1:20: pour to 200 g with the switch closed. 2:00: open the switch and draw down until 2:40. Water was Nestle at 150 ppm, probably contaminated by the kettle after using cheap high-ppm water. The result was still good."
  taste:
      fragrance: Deep, sweet fruit. Dark grape jelly and berry jam, rich and syrupy rather than fresh or citrusy.
      aroma: Brighter and sharper. Fresh red berries with a noticeable tartness, lively and juicy.
      hot: Bright, slightly sharp fruitiness with pleasant tartness. Sweet, juicy berries, like sugar and fruit preserves rather than caramel or honey. Flavours come in sweet and tart bursts.
      warm: Acidity softens and sweetness grows. Concentrated berry jam, rounded and slightly tart, with green grapes and a crisp, juicy edge.
      aftertaste: Fruity and lingering. Berry sweetness and gentle fruit acidity, not dry or bitter.
      mouthfeel: Juicy and lively, like a ripe, water-rich fruit. Bright and bursting with juice, not heavy or creamy.
  nextTime: Probably need to properly clean my kettle and grab a better paper filter.
